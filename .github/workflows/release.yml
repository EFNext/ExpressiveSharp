name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack-and-publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            # Read the tag from the release payload, NOT $GITHUB_REF_NAME: when a
            # release is published from a draft, the ref can resolve to the
            # default branch (main) instead of the tag, yielding an empty version.
            TAG="${{ github.event.release.tag_name }}"
          fi
          # Strip optional leading 'v': v1.2.3 -> 1.2.3
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version to publish (event=${{ github.event_name }}, tag='${TAG}'). An empty VersionPrefix would override the default 1.0.0 and break 'dotnet pack'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: >-
          dotnet pack --no-build -c Release
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          --output ./packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg
          retention-days: 90

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push ./packages/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
