<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpressiveSharp Playground</title>
    <base href="/ExpressiveSharp/_playground/" />
    <link href="ExpressiveSharp.Docs.Playground.Wasm.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.css" />
    <style>
        :root {
            --pg-bg: #ffffff;
            --pg-text: #1f2328;
            --pg-text-muted: #57606a;
            --pg-border: #d0d7de;
            --pg-surface: #f6f8fa;
            --pg-output-bg: #fafbfc;
            --pg-select-bg: #ffffff;
            --pg-brand: #7c3aed;
            --pg-error-bg: #fdf0f1;
            --pg-error-border: #f5c2c7;
            --pg-error-text: #842029;
        }
        html.dark {
            --pg-bg: #1b1b1f;
            --pg-text: #e1e1e3;
            --pg-text-muted: #a8a8ad;
            --pg-border: #3a3a3e;
            --pg-surface: #232326;
            --pg-output-bg: #1e1e21;
            --pg-select-bg: #2c2c30;
            --pg-brand: #a78bfa;
            --pg-error-bg: #3b1d20;
            --pg-error-border: #6b2d33;
            --pg-error-text: #f5a8a8;
        }
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--pg-bg);
            color: var(--pg-text);
        }
        expressive-playground {
            display: block;
            padding: 0.75rem 1.5rem;
            box-sizing: border-box;
        }
        #blazor-error-ui {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 0.6rem 1.25rem; background: lemonchiffon;
            border-top: 1px solid #f0e68c; display: none;
        }
        #blazor-error-ui.show { display: block; }
    </style>
    <script>
        // Dark mode detection + live sync from parent iframe
        (function() {
            var params = new URLSearchParams(location.search);
            var theme = params.get('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            window.addEventListener('message', function(e) {
                if (e.data === 'theme:dark') {
                    document.documentElement.classList.add('dark');
                    if (window.monaco) monaco.editor.setTheme('vs-dark');
                }
                if (e.data === 'theme:light') {
                    document.documentElement.classList.remove('dark');
                    if (window.monaco) monaco.editor.setTheme('vs');
                }
            });
        })();
    </script>
</head>
<body>
    <expressive-playground scenario="webshop"></expressive-playground>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
    </div>

    <script>
        window.expressivePlayground = {
            broadcastTarget: function (targetId) {
                document.querySelectorAll('expressive-playground').forEach(el => {
                    el.setAttribute('target', targetId);
                });
            },
        };

        // Deep link support
        (function () {
            if (!location.hash) return;
            var params = new URLSearchParams(location.hash.slice(1));
            var snippet = params.get('snippet');
            if (!snippet) return;

            function b64Decode(s) {
                s = s.replace(/-/g, '+').replace(/_/g, '/');
                while (s.length % 4) s += '=';
                return atob(s);
            }

            function applyDeepLink() {
                var el = document.querySelector('expressive-playground');
                if (!el) return requestAnimationFrame(applyDeepLink);
                el.setAttribute('snippet', b64Decode(snippet));
                var setup = params.get('setup');
                if (setup) el.setAttribute('setup', b64Decode(setup));
                var scenario = params.get('scenario');
                if (scenario) el.setAttribute('scenario', scenario);
            }
            applyDeepLink();
        })();
    </script>

    <!-- Monaco: load AMD loader, then require the editor module -->
    <script>
        // Notify parent iframe of height changes for auto-resize
        if (window.parent !== window) {
            var ro = new ResizeObserver(function() {
                var h = document.documentElement.scrollHeight;
                window.parent.postMessage({ type: 'playground-resize', height: h }, '*');
            });
            ro.observe(document.documentElement);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script>
        // Promise that resolves once Monaco is fully loaded via AMD require()
        window.__monacoReady = new Promise(function(resolve) {
            require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } });
            require(['vs/editor/editor.main'], function() {
                if (document.documentElement.classList.contains('dark')) {
                    monaco.editor.setTheme('vs-dark');
                }
                resolve();
            });
        });
    </script>
    <script src="js/monaco-interop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
